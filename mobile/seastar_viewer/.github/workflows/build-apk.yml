name: Build SEASTAR APK

# GitHub 저장소에 푸시하면 클라우드에서 APK가 자동 빌드됩니다.
# 빌드 결과는 Actions 탭 → 해당 실행 → Artifacts 에서 다운로드.
# (수동 실행: Actions 탭 → Build SEASTAR APK → Run workflow)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'mobile/seastar_viewer/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/seastar_viewer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.0'

      - name: Flutter pub get
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: seastar-viewer-apk
          path: mobile/seastar_viewer/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
